<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BURIM SELMANI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:ui-monospace, SFMono-Regular, Menlo, monospace;min-height:100vh}
  header{border-bottom:1px solid #222;padding:28px 20px;position:sticky;top:0;background:#0a0a0a;z-index:10}
  .brand{font-weight:900;letter-spacing:-0.04em;font-size:22px;line-height:1}
  .brand span{color:#737373;font-weight:400;font-size:12px;display:block;margin-top:6px;letter-spacing:0.18em}
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 120px}
  .hero{padding:12px 0 32px;border-bottom:1px solid #1a1a1a;margin-bottom:28px}
  .hero h1{font-size:42px;letter-spacing:-0.05em;line-height:0.9;font-weight:900;text-transform:uppercase}
  .hero h1 i{font-style:normal;color:#2a2a2a}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(min-width:760px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .card{background:#141414;border:1px solid #222;overflow:hidden}
  .img-wrap{aspect-ratio:1/1.1;background:#111;overflow:hidden}
  .img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
  .card:hover img{transform:scale(1.04)}
  .info{padding:14px 14px 16px;border-top:1px solid #1e1e1e}
  .info h2{font-size:13px;letter-spacing:0.02em;text-transform:uppercase;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info p{font-size:12px;color:#8a8a8a;margin-top:6px;letter-spacing:0.04em}
  footer{border-top:1px solid #1a1a1a;padding:24px 20px;color:#555;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;text-align:center}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  #lightbox.open{display:flex}
  #lightbox img{max-width:92vw;max-height:86vh;border:1px solid #222}
  #lightbox span{position:absolute;top:18px;right:18px;background:#fff;color:#000;font-size:12px;padding:10px 14px;cursor:pointer;letter-spacing:0.08em}
</style>
</head>
